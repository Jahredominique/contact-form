<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="contact-form.css"/>
</head>
<body>
    <Main>

        <form action="#">
            
            <h1>Contact Form<span>Please fill all the texts in the fields</span></h1>
           
            <label>
                <span>Your Name:</span>

                
                <input type="text" class="name" placeholder="Your Full Name" required/>
                

            </label>

            <label>
                <span>Your Email:</span>

                
                <input type="email" class="email" placeholder="Valid Email Address" required/>
                
            </label>

            <label class="Message">
                
                <span>Message:</span>

                
                <textarea id="Message" name="Message" placeholder="Your Message to Us"></textarea>
                

            </label>

            <label>
                <span>Subject:</span>
                <select name="selection">
                <option value="Job Inquiry">Job Inquiry</option>
                <option value="General Question">General Question</option>
                </select>
             </label>

            <input type="submit" class="button" value="Send" />
        </form>
    </Main>
</body>
</html>
